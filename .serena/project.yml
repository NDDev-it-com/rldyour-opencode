project:
  name: rldyour-opencode
  description: Personal OpenCode configuration marketplace providing rldyour plugins, skills, agents, custom commands, configuration, and Serena project knowledge.

languages:
  - yaml
  - json
  - markdown
  - bash

file_ignore:
  - "node_modules/**"
  - "dist/**"
  - ".git/**"
  - "browser/**"

instructions: |
  This repository is an OpenCode AI coding agent configuration marketplace.
  - AGENTS.md is the cross-tool root instruction file.
  - opencode.json is the master configuration.
  - .opencode/agents/*.md define subagents with YAML frontmatter.
  - .opencode/skills/*/SKILL.md define on-demand skills.
  - .opencode/commands/*.md define slash command templates.
  - references/*.md contain durable reference documentation.
  - .serena/memories/*.md contain verified high-signal project knowledge.
  - User-facing communication in Russian; repository files in English.
  - Quality and correctness over speed.
