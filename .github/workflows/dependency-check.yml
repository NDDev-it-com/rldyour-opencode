name: Dependency Freshness

on:
  # Weekly cron: Monday 06:00 UTC.
  schedule:
    - cron: "0 6 * * 1"
  # Manual dispatch for owner-initiated checks.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: dependency-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freshness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      # Actions pinned to commit SHA — see validate.yml header for rationale.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"

      - name: Pinned dependency report (no network)
        run: |
          bash scripts/check_deps_freshness.sh --json | tee dep-pins.json
          {
            echo "## Pinned dependencies"
            echo '```json'
            cat dep-pins.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: GitHub Actions pin integrity (remote)
        timeout-minutes: 5
        run: python3 scripts/check_action_pins.py .github/workflows --remote

      - name: Registry freshness probe (network)
        # Non-blocking on transient registry outages; CI summary still records
        # the result for review.
        continue-on-error: true
        timeout-minutes: 5
        run: |
          bash scripts/check_deps_freshness.sh --check-freshness --json | tee dep-freshness.json || true
          {
            echo "## Registry freshness"
            echo '```json'
            cat dep-freshness.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # MCP capability smoke probes. Remote MCP outage / URL drift would
      # otherwise be invisible until a live OpenCode session noticed.
      # Audit P1-4: split modes — remote-head exercises network-only,
      # local-launch exercises spawnable launchers. Both are continue-on-
      # error so a transient registry outage cannot block the scheduled
      # report. The full envelope is still published as a workflow summary.
      - name: Smoke MCP capabilities (remote-head)
        id: smoke_mcp_remote
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python3 scripts/smoke_mcp_capabilities.py --mode remote-head --json | tee mcp-smoke-remote.json
          {
            echo "## MCP smoke probe (remote-head)"
            echo '```json'
            cat mcp-smoke-remote.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke MCP capabilities (local-launch)
        id: smoke_mcp_local
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python3 scripts/smoke_mcp_capabilities.py --mode local-launch --json | tee mcp-smoke-local.json
          {
            echo "## MCP smoke probe (local-launch)"
            echo '```json'
            cat mcp-smoke-local.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
