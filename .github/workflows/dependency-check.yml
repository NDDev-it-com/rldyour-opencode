name: Dependency Freshness

on:
  # Weekly cron: Monday 06:00 UTC.
  schedule:
    - cron: "0 6 * * 1"
  # Manual dispatch for owner-initiated checks.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHA — see validate.yml header for rationale.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - name: Run dependency freshness report
        run: |
          bash scripts/check_deps_freshness.sh --json | tee dep-report.json
          {
            echo "## Pinned dependency report"
            echo '```json'
            cat dep-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # MCP capability smoke probe. Remote MCP outage / URL drift would
      # otherwise be invisible until a live OpenCode session noticed.
      # continue-on-error keeps a transient remote outage from blocking
      # the weekly cron — the JSON envelope still lands in the summary
      # for review. Local MCP probes always succeed in CI (the bunx /
      # uvx / dart launchers are not installed on the runner so they
      # report `skip`, which the smoke script treats as non-failing).
      - name: Smoke MCP capabilities (remote reachability)
        id: smoke_mcp
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python3 scripts/smoke_mcp_capabilities.py --json | tee mcp-smoke.json
          {
            echo "## MCP smoke probe"
            echo '```json'
            cat mcp-smoke.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
