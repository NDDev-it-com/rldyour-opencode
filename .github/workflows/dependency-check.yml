name: Dependency Freshness

on:
  # Weekly cron: Monday 06:00 UTC.
  schedule:
    - cron: "0 6 * * 1"
  # Manual dispatch for owner-initiated checks.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: dependency-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned to commit SHA — see validate.yml header for rationale.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      - name: Pinned dependency report (no network)
        run: |
          bash scripts/check_deps_freshness.sh --json | tee dep-pins.json
          {
            echo "## Pinned dependencies"
            echo '```json'
            cat dep-pins.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Registry freshness probe (network)
        # Non-blocking on transient registry outages; CI summary still records
        # the result for review.
        continue-on-error: true
        timeout-minutes: 5
        run: |
          bash scripts/check_deps_freshness.sh --check-freshness --json | tee dep-freshness.json || true
          {
            echo "## Registry freshness"
            echo '```json'
            cat dep-freshness.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # MCP capability smoke probe. Remote MCP outage / URL drift would
      # otherwise be invisible until a live OpenCode session noticed.
      - name: Smoke MCP capabilities (remote reachability)
        id: smoke_mcp
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python3 scripts/smoke_mcp_capabilities.py --json | tee mcp-smoke.json
          {
            echo "## MCP smoke probe"
            echo '```json'
            cat mcp-smoke.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
