name: Cross-platform

# Free public standard-runner portability smoke. The OpenCode runtime lane
# remains Ubuntu-only because it installs the pinned CLI and performs heavier
# runtime resolution; this lightweight lane covers standard public Ubuntu,
# Windows, and macOS runner families without larger/private runners.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '40 4 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: cross-platform smoke (${{ matrix.os }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    uses: NDDev-it-com/nddev-ci-workflows/.github/workflows/cross-platform-smoke.yml@ac4d1f469f5974741c7449305ffcbd5f05a5a47f # 0.5.1
    with:
      os_list: '["${{ matrix.os }}"]'
      timeout_minutes: 10
      command: |
        python - <<'PY'
        from pathlib import Path
        import compileall
        import json

        required = [
            "VERSION",
            "README.md",
            "opencode.json",
            ".github/branch-protection/main.json",
        ]
        missing = [path for path in required if not Path(path).exists()]
        if missing:
            raise SystemExit("missing required path(s): " + ", ".join(missing))

        json.loads(Path("opencode.json").read_text(encoding="utf-8"))
        json.loads(Path(".github/branch-protection/main.json").read_text(encoding="utf-8"))

        if not compileall.compile_dir("scripts", quiet=1):
            raise SystemExit("scripts/ Python compile failed")
        print("cross-platform metadata smoke passed")
        PY
