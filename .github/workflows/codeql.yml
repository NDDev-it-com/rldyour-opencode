name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Tuesday 04:29 UTC — outside business hours, decoupled from
    # the Monday dependency-check window.
    - cron: "29 4 * * 2"
  workflow_dispatch: {}

permissions:
  contents: read
  # CodeQL v4.35.5 reads workflow-run metadata in the post-processing step
  # that enriches SARIF with run fingerprints (see job log line "Adding
  # fingerprints to SARIF file"). Without `actions: read` the action exits
  # with "Resource not accessible by integration - workflow-runs#get-a-
  # workflow-run" AFTER analysis is already done — the SARIF is correct
  # but the job is marked failed. `actions: read` is the minimum required
  # to let CodeQL inspect its own run; it does NOT widen privileges
  # beyond reading public workflow metadata.
  actions: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript", "python"]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9e0d7b8d25671d64c341c19c0152d693099fb5ba  # v4.35.5
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
      - name: Autobuild
        uses: github/codeql-action/autobuild@9e0d7b8d25671d64c341c19c0152d693099fb5ba  # v4.35.5
      - name: Analyze
        uses: github/codeql-action/analyze@9e0d7b8d25671d64c341c19c0152d693099fb5ba  # v4.35.5
        with:
          category: "/language:${{ matrix.language }}"
          # This private repository does not have GitHub Code Security enabled.
          # Keep CodeQL extraction/query execution as a CI gate, but store SARIF
          # as a workflow artifact instead of uploading it to code scanning.
          upload: never
          upload-database: false
          output: codeql-results
      - name: Upload CodeQL SARIF artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: codeql-results
          if-no-files-found: error
          retention-days: 14
