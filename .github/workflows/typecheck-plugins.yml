name: Typecheck Plugins

on:
  push:
    branches: [main]
    paths:
      - ".opencode/plugins/**"
      - ".opencode/tsconfig.json"
      - ".opencode/package.json"
      - ".opencode/bun.lock"
  pull_request:
    paths:
      - ".opencode/plugins/**"
      - ".opencode/tsconfig.json"
      - ".opencode/package.json"
      - ".opencode/bun.lock"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: typecheck-plugins-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install plugin deps
        working-directory: .opencode
        run: bun install --frozen-lockfile
      - name: Run strict TypeScript typecheck
        working-directory: .opencode
        run: bunx --bun tsc --noEmit -p tsconfig.json
