name: SBOM Snapshot

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cyclonedx:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install plugin deps
        working-directory: .opencode
        run: bun install --frozen-lockfile
      - name: Generate CycloneDX SBOM (.opencode plugin deps)
        working-directory: .opencode
        run: npm sbom --sbom-format cyclonedx > ../sbom.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-${{ github.event.release.tag_name || github.sha }}
          path: sbom.json
          if-no-files-found: error
          retention-days: 14
