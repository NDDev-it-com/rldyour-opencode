name: SBOM Snapshot

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cyclonedx:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Generate CycloneDX SBOM (.opencode plugin deps)
        uses: CycloneDX/gh-node-module-generatebom@02f4abdef6cda31d50fc6a8eb22c1a48b04dd95b  # v1.x
        with:
          path: .opencode
          output: sbom.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-${{ github.event.release.tag_name || github.sha }}
          path: sbom.json
          if-no-files-found: error
