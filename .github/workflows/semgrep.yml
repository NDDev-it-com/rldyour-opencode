name: semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: semgrep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep OSS scan
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.164.0@sha256:207983631beecdbe7fa29196c7f4a7a5f29033933cdb76c687ce4a672e07618d
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Semgrep scan
        run: |
          semgrep scan \
            --config=p/python \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/github-actions \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/owasp-top-ten \
            --config=p/ci \
            --error \
            --metrics=off \
            --exclude='**/__pycache__/**' \
            --exclude='.opencode/node_modules/**' \
            --severity=WARNING \
            --severity=ERROR
