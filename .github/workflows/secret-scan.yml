name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # Gitleaks scans history; --fetch-depth: 0 ensures the full ref
          # graph is available so a long-lived feature branch is fully
          # covered, not just the PR head.
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@a3df37f9f7b4a87fb1d34835fbeb9c1f54cc4dcb  # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
