name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 6 * * 2"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # Gitleaks scans history; --fetch-depth: 0 ensures the full ref
          # graph is available so a long-lived feature branch is fully
          # covered, not just the PR head.
          fetch-depth: 0
      - name: Install Gitleaks CLI
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          GITLEAKS_LINUX_ARM64_SHA256: "e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080"
          GITLEAKS_DARWIN_ARM64_SHA256: "b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5"
          GITLEAKS_DARWIN_X64_SHA256: "dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709"
        run: |
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)
              asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
              expected="${GITLEAKS_LINUX_X64_SHA256}"
              ;;
            Linux-ARM64)
              asset="gitleaks_${GITLEAKS_VERSION}_linux_arm64.tar.gz"
              expected="${GITLEAKS_LINUX_ARM64_SHA256}"
              ;;
            macOS-ARM64)
              asset="gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz"
              expected="${GITLEAKS_DARWIN_ARM64_SHA256}"
              ;;
            macOS-X64)
              asset="gitleaks_${GITLEAKS_VERSION}_darwin_x64.tar.gz"
              expected="${GITLEAKS_DARWIN_X64_SHA256}"
              ;;
            *)
              echo "Unsupported runner platform: ${RUNNER_OS} ${RUNNER_ARCH}" >&2
              exit 1
              ;;
          esac
          curl -fsSL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          if command -v sha256sum >/dev/null; then
            echo "${expected}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          else
            printf "%s  /tmp/gitleaks.tar.gz\n" "${expected}" | shasum -a 256 -c -
          fi
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Gitleaks
        run: gitleaks detect --source . --redact --verbose --config .gitleaks.toml
