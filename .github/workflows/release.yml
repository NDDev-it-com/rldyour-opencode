name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (vMAJOR.MINOR.PATCH). Must match VERSION."
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - name: Set up Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5  # v2.0.2
        with:
          bun-version: "1.2.18"
      - name: Install plugin deps
        working-directory: .opencode
        run: bun install --frozen-lockfile
      - name: Install pytest + PyYAML
        run: python3 -m pip install --upgrade pip "pytest==9.0.2" "PyYAML==6.0.3"
      - name: Validate config + tests
        run: |
          bash scripts/validate_config.sh
          python3 -m pytest scripts/tests/ -q
      - name: Typecheck plugins
        working-directory: .opencode
        run: bunx --bun tsc --noEmit -p tsconfig.json
      - name: VERSION matches release tag
        run: |
          ver="$(cat VERSION)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag_input="${{ inputs.tag }}"
          else
            tag_input="${GITHUB_REF##*/}"
          fi
          expected="v${ver}"
          if [ "$tag_input" != "$expected" ]; then
            echo "[ERR] tag $tag_input does not match VERSION ($expected)"
            exit 1
          fi
          echo "[OK] tag $tag_input matches VERSION $ver"
      - name: Generate CycloneDX SBOM
        uses: CycloneDX/gh-node-module-generatebom@02f4abdef6cda31d50fc6a8eb22c1a48b04dd95b  # v1.x
        with:
          path: .opencode
          output: sbom.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json
          if-no-files-found: error
      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2f80e1d8ec6a17b075b88a48  # v2.0.8
        with:
          files: |
            sbom.json
            CHANGELOG.md
          generate_release_notes: true
          draft: false
