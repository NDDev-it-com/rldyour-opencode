name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (vMAJOR.MINOR.PATCH). Must match VERSION."
        required: true

permissions:
  contents: write
  # id-token: write + attestations: write are intentionally NOT requested
  # until the Sigstore-backed attest-build-provenance step is wired
  # (ADR-007 § Future work). Granting them today without a consumer
  # violates least-privilege per OSSF Scorecard "Token-Permissions".

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - name: Prepare agent-only validation context
        shell: bash
        run: |
          # Release runs the same pytest corpus as validate.yml. Some tests
          # assert cross-layer contracts in AGENTS.md / .claude, while normal
          # branches keep those files on origin/fullrepo. Restore only the
          # instruction docs and exclude marker; do not bootstrap fullrepo over
          # the release checkout because that could mask the tagged tree under
          # validation.
          git fetch --no-tags origin +refs/heads/fullrepo:refs/remotes/origin/fullrepo
          bash scripts/fullrepo_sync.sh install-exclude
          git show origin/fullrepo:AGENTS.md > AGENTS.md
          mkdir -p .claude
          git show origin/fullrepo:.claude/CLAUDE.md > .claude/CLAUDE.md
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install plugin deps
        working-directory: .opencode
        run: bun install --frozen-lockfile
      - name: Install pytest + PyYAML + jsonschema
        run: python3 -m pip install --upgrade pip "pytest==9.0.3" "PyYAML==6.0.3" "jsonschema==4.26.0"
      - name: Validate config + schema + skills index + tests
        run: |
          bash scripts/validate_config.sh
          python3 scripts/validate_opencode_schema.py
          python3 scripts/generate_skills_index.py --check --strict
          python3 -m pytest scripts/tests/ -q
      - name: Typecheck plugins
        working-directory: .opencode
        run: bunx --bun tsc --noEmit -p tsconfig.json
      - name: VERSION matches release tag
        run: |
          ver="$(cat VERSION)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag_input="${{ inputs.tag }}"
          else
            tag_input="${GITHUB_REF##*/}"
          fi
          expected="v${ver}"
          if [ "$tag_input" != "$expected" ]; then
            echo "[ERR] tag $tag_input does not match VERSION ($expected)"
            exit 1
          fi
          echo "[OK] tag $tag_input matches VERSION $ver"
      - name: Resolve release tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf 'tag=%s\n' "${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            printf 'tag=%s\n' "${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate CycloneDX SBOM
        uses: CycloneDX/gh-node-module-generatebom@27e13c2bf0fae78d66387b35ca9749d8cc853060  # v1.0.3
        with:
          path: .opencode
          output: sbom.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json
          if-no-files-found: error
      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          files: |
            sbom.json
            CHANGELOG.md
          generate_release_notes: true
          draft: false
