name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Numeric SemVer X.Y.Z; manual dispatch only verifies an existing tag."
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve existing release tag
        id: release_tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            release_version="$REF_NAME"
          else
            release_version="$INPUT_VERSION"
            echo "manual dispatch only verifies an existing tag"
          fi
          if ! printf '%s' "$release_version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid release version (not bare SemVer): $release_version" >&2
            exit 1
          fi

          remote_ref="refs/tags/${release_version}"
          remote_match="$(git ls-remote --refs origin "$remote_ref")"
          remote_count="$(printf '%s\n' "$remote_match" | awk 'NF { count++ } END { print count + 0 }')"
          if [ "$remote_count" -ne 1 ]; then
            echo "Expected exactly one existing remote tag $remote_ref" >&2
            exit 1
          fi
          read -r remote_oid remote_name <<< "$remote_match"
          if [ "$remote_name" != "$remote_ref" ]; then
            echo "Remote returned unexpected ref $remote_name" >&2
            exit 1
          fi
          git fetch --no-tags --force origin "$remote_ref:$remote_ref"
          local_oid="$(git rev-parse --verify "$remote_ref")"
          if [ "$local_oid" != "$remote_oid" ]; then
            echo "Fetched tag object does not match $remote_ref on origin" >&2
            exit 1
          fi
          tag_commit="$(git rev-parse --verify "${remote_ref}^{commit}")"

          git fetch --no-tags --force origin main:refs/remotes/origin/main
          if [ "$EVENT_NAME" = "push" ]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "Pushed tag peels to $tag_commit, not event commit $GITHUB_SHA" >&2
              exit 1
            fi
          else
            git merge-base --is-ancestor "$tag_commit" origin/main
          fi
          git checkout --detach "$tag_commit"

          current="$(cat VERSION)"
          if [ "$current" != "$release_version" ]; then
            echo "VERSION file is $current but release asked for $release_version" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$release_version" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$current" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install plugin deps
        working-directory: .opencode
        run: bun install --frozen-lockfile
      - name: Install pytest + PyYAML + jsonschema + referencing (pinned)
        # `referencing` pinned explicitly per integration-review F-1 so the
        # release gate cannot silently lose this transitive dependency.
        run: python3 -m pip install --upgrade pip "pytest==9.1.1" "PyYAML==6.0.3" "jsonschema==4.26.0" "referencing==0.37.0"
      - name: Validate config + baseline + schema + profiles + indices + tests
        # Release gate mirrors validate.yml ordering so a green release
        # implies the same offline-safe gate set. New entries since v0.12.1:
        # check_baseline_consistency.py (P0-1) and validate_mcp_profiles.py
        # (P1-3). validate_opencode_schema.py is offline-safe (P0-2).
        run: |
          bash scripts/validate_config.sh
          python3 scripts/validate_opencode_baseline.py
          python3 scripts/validate_opencode_schema.py
          python3 scripts/validate_mcp_profiles.py
          python3 scripts/generate_skills_index.py --check --strict
          python3 scripts/generate_commands_index.py --check --strict
          python3 scripts/generate_plugins_index.py --check --strict
          python3 scripts/check_plugin_hooks.py
          python3 scripts/validate_contract.py
          python3 scripts/smoke_mcp_capabilities.py --mode static --json
          python3 -m pytest scripts/tests/ -q
      - name: Typecheck plugins
        working-directory: .opencode
        run: bunx --bun tsc --noEmit -p tsconfig.json
      - name: Generate CycloneDX SBOM
        working-directory: .opencode
        run: npm sbom --sbom-format cyclonedx > ../sbom.json
      - name: Build release evidence and checksums
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          cp sbom.json release-evidence/sbom.json
          cp CHANGELOG.md release-evidence/CHANGELOG.md
          cp VERSION release-evidence/VERSION
          cp opencode.json release-evidence/opencode.json
          cp opencode.release-safe.json release-evidence/opencode.release-safe.json
          cp references/opencode-baseline.json release-evidence/opencode-baseline.json
          tar -czf release-evidence.tgz release-evidence/
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum \
              sbom.json \
              CHANGELOG.md \
              release-evidence.tgz \
              > SHA256SUMS
          else
            shasum -a 256 \
              sbom.json \
              CHANGELOG.md \
              release-evidence.tgz \
              > SHA256SUMS
          fi
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-${{ matrix.os }}-${{ github.sha }}
          path: |
            sbom.json
            release-evidence.tgz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Attest release evidence bundle
        if: matrix.os == 'ubuntu-latest'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: release-evidence.tgz
      - name: Attest generated SBOM
        if: matrix.os == 'ubuntu-latest'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: sbom.json
      - name: Publish GitHub Release
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release upload "$RELEASE_VERSION" \
              sbom.json \
              CHANGELOG.md \
              release-evidence.tgz \
              SHA256SUMS \
              --clobber
          else
            gh release create "$RELEASE_VERSION" \
              --verify-tag \
              --title "$RELEASE_VERSION" \
              --generate-notes \
              sbom.json \
              CHANGELOG.md \
              release-evidence.tgz \
              SHA256SUMS
          fi
