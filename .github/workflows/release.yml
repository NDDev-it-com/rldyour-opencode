name: Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release from VERSION (numeric SemVer X.Y.Z). Creates the tag when dispatching manually."
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
      - name: Prepare agent-only validation context
        shell: bash
        run: |
          # Release runs the same pytest corpus as validate.yml. Some tests
          # assert cross-layer contracts in AGENTS.md / .claude, while normal
          # branches keep those files on origin/fullrepo. Restore only the
          # instruction docs and exclude marker; do not bootstrap fullrepo over
          # the release checkout because that could mask the tagged tree under
          # validation.
          # Audit P1-5: restore is a FALLBACK, not an overwrite — a tag built
          # from a branch that already contains AGENTS.md / .claude/CLAUDE.md
          # must keep its own copy so the release validates the tagged
          # contents, not the published fullrepo snapshot.
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/fullrepo:refs/remotes/origin/fullrepo || true
          bash scripts/fullrepo_sync.sh install-exclude
          for path in AGENTS.md .claude/CLAUDE.md; do
            if [ ! -f "${path}" ] && git show "origin/fullrepo:${path}" >/dev/null 2>&1; then
              mkdir -p "$(dirname "${path}")"
              git show "origin/fullrepo:${path}" > "${path}"
            fi
          done
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install plugin deps
        working-directory: .opencode
        run: bun install --frozen-lockfile
      - name: Install pytest + PyYAML + jsonschema + referencing (pinned)
        # `referencing` pinned explicitly per integration-review F-1 so the
        # release gate cannot silently lose this transitive dependency.
        run: python3 -m pip install --upgrade pip "pytest==9.0.3" "PyYAML==6.0.3" "jsonschema==4.26.0" "referencing==0.36.2"
      - name: Validate config + baseline + schema + profiles + indices + tests
        # Release gate mirrors validate.yml ordering so a green release
        # implies the same offline-safe gate set. New entries since v0.12.1:
        # check_baseline_consistency.py (P0-1) and validate_mcp_profiles.py
        # (P1-3). validate_opencode_schema.py is offline-safe (P0-2).
        run: |
          bash scripts/validate_config.sh
          python3 scripts/validate_opencode_baseline.py
          python3 scripts/validate_opencode_schema.py
          python3 scripts/validate_mcp_profiles.py
          python3 scripts/generate_skills_index.py --check --strict
          python3 scripts/generate_commands_index.py --check --strict
          python3 scripts/generate_plugins_index.py --check --strict
          python3 scripts/check_plugin_hooks.py
          python3 scripts/validate_contract.py
          python3 scripts/smoke_mcp_capabilities.py --mode static --json
          python3 -m pytest scripts/tests/ -q
      - name: Typecheck plugins
        working-directory: .opencode
        run: bunx --bun tsc --noEmit -p tsconfig.json
      - name: VERSION matches release tag
        # Map workflow_dispatch inputs through env so untrusted strings
        # never reach the shell parser via `${{ ... }}` interpolation.
        # GitHub Actions security hardening guide:
        # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions
        # Reviewer wave 2026-05-18 security F-3 closure.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          ver="$(cat VERSION)"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag_input="$INPUT_VERSION"
          else
            tag_input="${GITHUB_REF##*/}"
          fi
          expected="${ver}"
          if [ "$tag_input" != "$expected" ]; then
            echo "[ERR] tag $tag_input does not match VERSION ($expected)"
            exit 1
          fi
          echo "[OK] tag $tag_input matches VERSION $ver"
      - name: Resolve release tag
        id: release_tag
        # Same env-mapped pattern as the VERSION check above; reviewer
        # wave 2026-05-18 security F-3 closure.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            printf 'tag=%s\n' "$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            printf 'tag=%s\n' "${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          fi
          printf 'version=%s\n' "$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Generate CycloneDX SBOM
        working-directory: .opencode
        run: npm sbom --sbom-format cyclonedx > ../sbom.json
      - name: Build release evidence and checksums
        run: |
          set -euo pipefail
          mkdir -p release-evidence
          cp sbom.json release-evidence/sbom.json
          cp CHANGELOG.md release-evidence/CHANGELOG.md
          cp VERSION release-evidence/VERSION
          cp opencode.json release-evidence/opencode.json
          cp opencode.release-safe.json release-evidence/opencode.release-safe.json
          cp references/opencode-baseline.json release-evidence/opencode-baseline.json
          tar -czf release-evidence.tgz release-evidence/
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum \
              sbom.json \
              CHANGELOG.md \
              release-evidence.tgz \
              > SHA256SUMS
          else
            shasum -a 256 \
              sbom.json \
              CHANGELOG.md \
              release-evidence.tgz \
              > SHA256SUMS
          fi
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-${{ matrix.os }}-${{ github.sha }}
          path: |
            sbom.json
            release-evidence.tgz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Attest release evidence bundle
        if: matrix.os == 'ubuntu-latest'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26  # v4.1.0
        with:
          subject-path: release-evidence.tgz
      - name: Attest generated SBOM
        if: matrix.os == 'ubuntu-latest'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26  # v4.1.0
        with:
          subject-path: sbom.json
      - name: Create release tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch' && matrix.os == 'ubuntu-latest'
        env:
          RELEASE_VERSION: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${RELEASE_VERSION}" >/dev/null; then
            echo "Tag ${RELEASE_VERSION} already exists locally"
          else
            git tag "${RELEASE_VERSION}"
            git push origin "refs/tags/${RELEASE_VERSION}"
          fi
      - name: Publish GitHub Release
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release upload "$RELEASE_VERSION" \
              sbom.json \
              CHANGELOG.md \
              release-evidence.tgz \
              SHA256SUMS \
              --clobber
          else
            gh release create "$RELEASE_VERSION" \
              --verify-tag \
              --title "$RELEASE_VERSION" \
              --generate-notes \
              sbom.json \
              CHANGELOG.md \
              release-evidence.tgz \
              SHA256SUMS
          fi
