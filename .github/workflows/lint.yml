name: Lint

on:
  push:
    branches: [main]
    paths:
      - "scripts/**.py"
      - "pyrightconfig.json"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "scripts/**.py"
      - "pyrightconfig.json"
      - ".github/workflows/lint.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - name: Install ruff (pinned)
        run: python3 -m pip install --upgrade pip "ruff==0.12.0"
      - name: ruff check
        run: ruff check scripts
