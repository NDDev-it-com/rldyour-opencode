name: Lint

on:
  push:
    branches: [main]
    paths:
      - "scripts/*.py"
      - "scripts/**/*.py"
      - "pyrightconfig.json"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "scripts/*.py"
      - "scripts/**/*.py"
      - "pyrightconfig.json"
      - ".github/workflows/lint.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"
      - name: Install ruff (pinned)
        run: python3 -m pip install --upgrade pip "ruff==0.15.20"
      - name: ruff check
        run: ruff check scripts
