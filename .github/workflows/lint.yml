name: Lint

on:
  push:
    branches: [main]
    paths:
      - "scripts/**.py"
      - "pyrightconfig.json"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "scripts/**.py"
      - "pyrightconfig.json"
      - ".github/workflows/lint.yml"

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - name: Install ruff (pinned)
        run: python3 -m pip install --upgrade pip "ruff==0.12.0"
      - name: ruff check
        run: ruff check scripts
