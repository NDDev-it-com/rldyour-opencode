name: Dependency Review

on:
  pull_request:
    paths:
      - ".opencode/package.json"
      - ".opencode/bun.lock"
      - ".github/workflows/**"
      - "scripts/*.py"
      - "scripts/**/*.py"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  dependency-review:
    name: Dependency review
    permissions:
      contents: read
      pull-requests: write
    uses: NDDev-it-com/ci-workflows/.github/workflows/public-dependency-review.yml@7f69c724923d06b2c2057c5a6ad341c37f1a8995 # 0.13.3
    with:
      fail_on_severity: moderate
      comment_summary_in_pr: on-failure
