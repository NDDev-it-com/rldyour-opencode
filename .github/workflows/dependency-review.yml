name: Dependency Review

on:
  pull_request:
    paths:
      - ".opencode/package.json"
      - ".opencode/bun.lock"
      - ".github/workflows/**"
      - "scripts/*.py"
      - "scripts/**/*.py"

permissions: {}

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    permissions:
      contents: read
      pull-requests: write
    uses: NDDev-it-com/nddev-ci-workflows/.github/workflows/public-dependency-review.yml@21bd3f7c3bbcbd7a9ecd3475b293d9e65aa8563a # 0.2.2
    with:
      fail_on_severity: moderate
      comment_summary_in_pr: on-failure
