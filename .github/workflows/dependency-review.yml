name: Dependency Review

on:
  pull_request:
    paths:
      - ".opencode/package.json"
      - ".opencode/bun.lock"
      - ".github/workflows/**"
      - "scripts/*.py"
      - "scripts/**/*.py"

permissions: {}

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    permissions:
      contents: read
      pull-requests: write
    uses: NDDev-it-com/nddev-ci-workflows/.github/workflows/public-dependency-review.yml@2ccb80e96f5771b6a6b4eae63a4f47e232906dc7 # 0.12.0
    with:
      fail_on_severity: moderate
      comment_summary_in_pr: on-failure
