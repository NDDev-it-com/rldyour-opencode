name: Dependency Review

on:
  pull_request:
    paths:
      - ".opencode/package.json"
      - ".opencode/bun.lock"
      - ".github/workflows/**"
      - "scripts/*.py"
      - "scripts/**/*.py"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  dependency-review:
    name: Dependency review
    permissions:
      contents: read
      pull-requests: write
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/public-dependency-review.yml@36bea6e4ac643872e9a504b2fe19aad9487e398a # 0.2.0-dev
    with:
      fail_on_severity: moderate
      comment_summary_in_pr: on-failure
