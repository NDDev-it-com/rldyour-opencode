name: Dependency Review

on:
  pull_request:
    paths:
      - ".opencode/package.json"
      - ".opencode/bun.lock"
      - ".github/workflows/**"
      - "scripts/*.py"
      - "scripts/**/*.py"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  dependency-review:
    name: Dependency review
    permissions:
      contents: read
      pull-requests: write
    uses: NDDev-OpenNetwork/ci-workflows/.github/workflows/public-dependency-review.yml@1eaaa687f32f81c33ac99be3db0b76d0204420b8 # 0.1.8
    with:
      fail_on_severity: moderate
      comment_summary_in_pr: on-failure
