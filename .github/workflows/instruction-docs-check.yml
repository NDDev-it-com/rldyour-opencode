name: Instruction Docs Check

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".claude/CLAUDE.md"
      - ".serena/memories/**"
      - "docs/**"
      - "references/**"
      - ".opencode/**"
      - "README.md"
      - "CHANGELOG.md"
      - "VERSION"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - ".claude/CLAUDE.md"
      - ".serena/memories/**"
      - "docs/**"
      - "references/**"
      - ".opencode/**"
      - "README.md"
      - "CHANGELOG.md"
      - "VERSION"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: instruction-docs-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instruction-docs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
      - name: Validate instruction docs
        # AGENTS.md and .claude/CLAUDE.md live on the `tracked context` orphan branch
        # in the agent-only artifact path. PR runs against the normal branch
        # do not see them; the script tolerates absent files gracefully. The
        # cron run scheduled in validate.yml uses the same script but reads
        # the tracked context snapshot via a separate checkout step (deferred to
        # future automation).
        run: |
          if [ -f AGENTS.md ] && [ -f .claude/CLAUDE.md ]; then
            python3 scripts/validate_instruction_docs.py
          else
            echo "[INFO] AGENTS.md / .claude/CLAUDE.md not present on this branch (normal-branch PR); skipping"
          fi
