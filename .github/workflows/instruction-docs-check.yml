name: Instruction Docs Check

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".claude/CLAUDE.md"
      - ".serena/memories/**"
      - "docs/**"
      - "references/**"
      - ".opencode/**"
      - "README.md"
      - "CHANGELOG.md"
      - "VERSION"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - ".claude/CLAUDE.md"
      - ".serena/memories/**"
      - "docs/**"
      - "references/**"
      - ".opencode/**"
      - "README.md"
      - "CHANGELOG.md"
      - "VERSION"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: instruction-docs-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instruction-docs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"
      - name: Validate instruction docs
        # AGENTS.md and .claude/CLAUDE.md are tracked on main; validation is strict.
        run: python3 scripts/validate_instruction_docs.py
