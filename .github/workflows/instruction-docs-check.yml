name: Instruction Docs Check

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".claude/CLAUDE.md"
      - ".serena/memories/**"
      - "docs/**"
      - "references/**"
      - ".opencode/**"
      - "README.md"
      - "CHANGELOG.md"
      - "VERSION"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - ".claude/CLAUDE.md"
      - ".serena/memories/**"
      - "docs/**"
      - "references/**"
      - ".opencode/**"
      - "README.md"
      - "CHANGELOG.md"
      - "VERSION"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: instruction-docs-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instruction-docs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Validate instruction docs
        # AGENTS.md and .claude/CLAUDE.md are tracked on main; validation is strict.
        run: python3 scripts/validate_instruction_docs.py
