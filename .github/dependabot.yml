# Dependabot configuration for rldyour-opencode.
#
# Ecosystems:
# - npm  : .opencode/package.json (plugin SDK pin + future plugin deps)
# - github-actions: workflow action SHAs (keeps SHA pins fresh)
# - pip  : workflow-side test/lint deps installed via `python -m pip install`
#          (Dependabot itself does not scan inline `pip install` calls; tests
#          live in workflows and are pinned explicitly per workflow file)
#
# Reviewer assignment is handled by CODEOWNERS at .github/CODEOWNERS.

version: 2
updates:
  - package-ecosystem: npm
    directory: "/.opencode"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "deps"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      include: scope

    cooldown:
      default-days: 7
    groups:
      npm-minor:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ['*']
      npm-major:
        applies-to: version-updates
        update-types: [major]
        patterns: ['*']
      npm-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - "ci"
      - "dependencies"
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns: ['*']
